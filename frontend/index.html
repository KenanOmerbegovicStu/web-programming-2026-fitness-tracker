<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitnessTracker</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="app-navbar sticky-top">
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#dashboard">
          <span class="brand-icon"><i class="bi bi-lightning-charge-fill"></i></span>
          FitnessTracker
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="#dashboard"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="#workout-log"><i class="bi bi-plus-circle me-1"></i>Log Workout</a></li>
            <li class="nav-item"><a class="nav-link" href="#workout-history"><i class="bi bi-clock-history me-1"></i>History</a></li>
            <li class="nav-item"><a class="nav-link" href="#exercise-library"><i class="bi bi-collection me-1"></i>Exercises</a></li>
            <li class="nav-item"><a class="nav-link" href="#progress"><i class="bi bi-graph-up-arrow me-1"></i>Progress</a></li>
            <li class="nav-item admin-only"><a class="nav-link" href="#admin-panel"><i class="bi bi-shield-lock me-1"></i>Admin</a></li>
          </ul>

          <ul class="navbar-nav">
            <li class="nav-item dropdown">
              <button class="nav-link dropdown-toggle d-flex align-items-center gap-2" type="button"
                      data-bs-toggle="dropdown" aria-expanded="false">
                <span class="avatar avatar-sm">KT</span>
                Keno Test
              </button>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="#profile"><i class="bi bi-person me-2"></i>My profile</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" href="#login"><i class="bi bi-box-arrow-right me-2"></i>Log out</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main id="spapp" role="main">
    <section id="login"></section>
    <section id="register"></section>
    <section id="dashboard"></section>
    <section id="workout-log"></section>
    <section id="workout-history"></section>
    <section id="exercise-library"></section>
    <section id="progress"></section>
    <section id="profile"></section>
    <section id="admin-panel" class="admin-only"></section>
    <section id="error_404">
      <div class="container py-5">
        <div class="text-center py-5">
          <div class="display-1 fw-bold text-primary">404</div>
          <h1 class="h3 mb-3">Page not found</h1>
          <p class="text-body-secondary mb-4">The page you are looking for does not exist.</p>
          <a href="#dashboard" class="btn btn-primary"><i class="bi bi-house me-1"></i>Back to dashboard</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="app-footer py-4 mt-5">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2 small text-body-secondary">
      <span>&copy; 2026 FitnessTracker &middot; IT 2001 Web Programming</span>
      <span>Exercise data partly provided by <a href="https://wger.de" target="_blank" rel="noopener">wger.de</a></span>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/jquery.spapp.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
